<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Codex Telegram Logo</title>
  <desc id="desc">A rounded blue-green app mark with a Telegram-style paper plane, terminal prompt, and Codex cursor.</desc>
  <defs>
    <linearGradient id="bg" x1="62" y1="40" x2="450" y2="472" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0b1d2a"/>
      <stop offset="0.52" stop-color="#103548"/>
      <stop offset="1" stop-color="#1d6b73"/>
    </linearGradient>
    <linearGradient id="plane" x1="154" y1="123" x2="379" y2="357" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8be7ff"/>
      <stop offset="1" stop-color="#43d6a3"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#020a11" flood-opacity="0.42"/>
    </filter>
  </defs>

  <rect x="28" y="28" width="456" height="456" rx="96" fill="url(#bg)"/>
  <path d="M96 110c54-47 143-64 219-37 76 27 121 91 110 164-10 73-72 133-153 151-81 17-172-8-205-66-33-59-25-164 29-212Z" fill="#ffffff" opacity="0.06"/>
  <path d="M119 347c59 60 178 67 248 19 70-49 88-149 40-224" fill="none" stroke="#87f7cf" stroke-width="8" stroke-linecap="round" opacity="0.2"/>

  <g filter="url(#softShadow)">
    <path d="M139 160c-22 10-21 42 1 51l72 28 28 72c9 22 41 23 51 1l88-194c8-18-10-36-28-28l-212 70Z" fill="url(#plane)"/>
    <path d="M213 239 352 103 270 316l-29-77-28 0Z" fill="#092033" opacity="0.28"/>
    <path d="M213 239 352 103 241 239l29 77Z" fill="#ffffff" opacity="0.34"/>
  </g>

  <g transform="translate(96 312)">
    <rect width="320" height="90" rx="26" fill="#08141f" opacity="0.82"/>
    <path d="M34 36h42M55 22l22 14-22 14" fill="none" stroke="#43d6a3" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="98" y="55" fill="#d7f7ff" font-family="Cascadia Mono, Consolas, monospace" font-size="32" font-weight="700">codex</text>
    <rect x="219" y="30" width="14" height="34" rx="4" fill="#8be7ff"/>
  </g>

  <path d="M102 104h95" stroke="#8be7ff" stroke-width="10" stroke-linecap="round" opacity="0.38"/>
  <path d="M88 128h54" stroke="#43d6a3" stroke-width="8" stroke-linecap="round" opacity="0.3"/>
</svg>

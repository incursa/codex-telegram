version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Denver
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: build

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Denver
    labels:
      - dependencies
      - nuget
    commit-message:
      prefix: build

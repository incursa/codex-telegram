name: Publish

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish (${{ matrix.asset_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2025
            runtime: win-x64
            asset_name: codex-telegram-win-x64
          - os: ubuntu-24.04
            runtime: linux-x64
            asset_name: codex-telegram-linux-x64
          - os: macos-15
            runtime: osx-arm64
            asset_name: codex-telegram-osx-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore CodexTelegram.slnx

      - name: Build
        run: dotnet build CodexTelegram.slnx -c Release --no-restore -m:1

      - name: Format
        run: dotnet format CodexTelegram.slnx --verify-no-changes --no-restore

      - name: Package vulnerability report
        run: dotnet list CodexTelegram.slnx package --vulnerable --include-transitive

      - name: Test
        run: dotnet test tests/Incursa.Codex.Telegram.Tests/Incursa.Codex.Telegram.Tests.csproj -c Release --no-build --no-restore -m:1

      - name: Telegram fuzz corpus
        shell: pwsh
        run: pwsh -File scripts/Test-TelegramFuzzCorpus.ps1 -Configuration Release -NoRestore -NoBuild

      - name: Publish binary
        id: publish
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP "codex-telegram-${{ matrix.runtime }}"
          New-Item -ItemType Directory -Force -Path $publishDir | Out-Null

          dotnet publish src/Incursa.Codex.Telegram/Incursa.Codex.Telegram.csproj `
            -c Release `
            -r ${{ matrix.runtime }} `
            -o $publishDir `
            /p:AssemblyName=codex-telegram `
            /p:PublishSingleFile=true `
            /p:SelfContained=true

          $binary = Get-ChildItem -Path $publishDir -File |
            Where-Object { $_.BaseName -eq 'codex-telegram' -and ($_.Extension -eq '.exe' -or $_.Extension -eq '') } |
            Select-Object -First 1

          if (-not $binary) {
            throw "Published binary not found in $publishDir."
          }

          $assetPath = Join-Path $publishDir ("${{ matrix.asset_name }}{0}" -f $binary.Extension)
          Move-Item -LiteralPath $binary.FullName -Destination $assetPath

          $checksumPath = "$assetPath.sha256"
          $hash = Get-FileHash -LiteralPath $assetPath -Algorithm SHA256
          "$($hash.Hash.ToLowerInvariant())  $(Split-Path -Leaf $assetPath)" | Set-Content -LiteralPath $checksumPath -Encoding ascii

          $licensePath = Join-Path $publishDir "${{ matrix.asset_name }}-LICENSE.txt"
          Copy-Item -LiteralPath LICENSE -Destination $licensePath -Force

          "asset_path=$assetPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "checksum_path=$checksumPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "license_path=$licensePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: |
            ${{ steps.publish.outputs.asset_path }}
            ${{ steps.publish.outputs.checksum_path }}
            ${{ steps.publish.outputs.license_path }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Create GitHub Release
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/release-assets

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
          RELEASE_DIR: ${{ runner.temp }}/release-assets
        run: |
          $version = $env:TAG_NAME.TrimStart('v')
          $assets = Get-ChildItem -Path $env:RELEASE_DIR -File -Recurse |
            Sort-Object FullName |
            Select-Object -ExpandProperty FullName

          if (-not $assets) {
            throw "No release assets were downloaded."
          }

          gh release create $env:TAG_NAME $assets --title $version --generate-notes --repo $env:GH_REPO

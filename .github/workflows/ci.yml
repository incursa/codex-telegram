name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2025
          - ubuntu-24.04
          - macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore CodexTelegram.slnx

      - name: Build
        run: dotnet build CodexTelegram.slnx -c Release --no-restore -m:1

      - name: Test
        run: dotnet test tests/Incursa.Codex.Telegram.Tests/Incursa.Codex.Telegram.Tests.csproj -c Release --no-build --no-restore -m:1

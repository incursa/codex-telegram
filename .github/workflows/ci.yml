name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-2025-vs2026
          - ubuntu-24.04
          - macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore CodexTelegram.slnx

      - name: Build
        run: dotnet build CodexTelegram.slnx -c Release --no-restore -m:1

      - name: Format
        run: dotnet format CodexTelegram.slnx --verify-no-changes --no-restore

      - name: Package vulnerability report
        run: dotnet list CodexTelegram.slnx package --vulnerable --include-transitive

      - name: Tracked-file secret scan
        shell: pwsh
        run: pwsh -File scripts/Test-TrackedSecretScan.ps1

      - name: Test
        run: dotnet test tests/Incursa.Codex.Telegram.Tests/Incursa.Codex.Telegram.Tests.csproj -c Release --no-build --no-restore -m:1

      - name: Telegram fuzz corpus
        shell: pwsh
        run: pwsh -File scripts/Test-TelegramFuzzCorpus.ps1 -Configuration Release -NoRestore -NoBuild

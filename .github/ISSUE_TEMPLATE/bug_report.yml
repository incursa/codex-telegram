name: Bug Report
description: Report reproducible Codex Telegram behavior.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Use this form for reproducible behavior in the released binary or the current source tree. Do not include bot tokens, OpenAI keys, private transcripts, or local credential paths.
  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I have searched existing issues.
          required: true
        - label: I have removed secrets, private paths, and private transcript content.
          required: true
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release version, commit SHA, or "source build".
      placeholder: v1.0.6
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps To Reproduce
      description: Provide the smallest reproducible path.
      placeholder: |
        1. Configure ...
        2. Send ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized Logs Or Screenshots
      description: Optional. Redact tokens, paths, repository names, and private chat content.
      render: text
  - type: textarea
    id: notes
    attributes:
      label: Additional Context
      description: Mention Telegram private chat, group, forum topic, voice, attachment, queueing, or menu behavior if relevant.
